body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}

.name{font-size:1.2rem;font-weight:600;margin:0 0 12px}

table{width:100%;border-collapse:collapse}
td{padding:8px 0;border-top:1px solid var(--line)}
td:last-child{text-align:right;font-weight:600}
.err{color:var(--bad)}
.flag{color:var(--bad)}
.note{color:var(--muted);font-size:.82rem}

const LABELS = ["Assignment 1","Assignment 2","Assignment 3","Alternative Assessment 1","Alternative Assessment 2","Alternative Assessment 3","CIE-1","CIE-2"];
const GROUPS = [["Assignments",0,3],["Alternative Assessments",3,6],["CIE",6,8]];
const parse = (raw, branch) => raw.split("\n").map(l => { const p = l.split("|"); return {branch, roll:p[0], name:p[1], m:p.slice(2,10)}; });
const STUDENTS = [...parse(RAW,"CSM-B"), ...parse(RAW_C,"CSM-C")];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function find(q){
  const exact = STUDENTS.filter(s => s.roll === q);
  if (exact.length) return exact;
  if (q.length === 3) return STUDENTS.filter(s => s.roll.endsWith(q));
  return [];
}
function fmt(v){
  v = (v || "").trim();
  if (!v) return "—";
  return /^(NS|AB|ABSENT)$/i.test(v) ? `<span class="flag">${esc(v.toUpperCase())}</span>` : esc(v);
}
function show(){
  const q = document.getElementById("roll").value.replace(/\s/g,"");
  const out = document.getElementById("out");
  if (!q) { out.innerHTML = '<div class="card err">Please enter a Roll No. first.</div>'; return; }
  const hits = find(q); const s = hits.length === 1 ? hits[0] : null;
  if (!s) { out.innerHTML = '<div class="card err">' + (hits.length > 1 ? 'More than one student matches these last 3 digits. Please enter the full 12-digit Roll No.' : 'No record found for this Roll No. Please check and try again.') + '</div>'; return; }
  let html = `<div class="card"><p class="sec">${s.branch} · Roll No. ${esc(s.roll)}</p><p class="name">${esc(s.name)}</p>`;
  GROUPS.forEach(([title,a,b]) => {
    html += `<h2>${title}</h2><table>`;
    for (let i=a;i<b;i++) html += `<tr><td>${LABELS[i]}</td><td>${fmt(s.m[i])}</td></tr>`;
    html += `</table>`;
  });
  out.innerHTML = html + `</div>`;
}
document.getElementById("go").onclick = show;
document.getElementById("roll").addEventListener("keydown", e => { if (e.key === "Enter") show(); });
